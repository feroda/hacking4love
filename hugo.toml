baseURL = "https://hacking4love.it/"
languageCode = "it-IT"
defaultContentLanguage = "it"
title = "Hacking 4 Love"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  sito = "https://hacking4love.it"
  description = "Mi offro per chiudere Uroboro. Sono qui per ritrovare l'UOMO al centro dell'Universo. Componi il puzzle."
  autore = "Lucafero da Fabriano"
  email = "uroboro@befair.it"
  # Il tuo sito personale: gli articoli-indizio vivranno lì
  sitoPersonale = "https://example.org/"
  # Canale Telegram del progetto. Vuoto = pulsante nascosto.
  telegram = "https://t.me/my_uroboro"
  # Contatti privati. Vuoto = link nascosto.
  telegramPersonale = "https://t.me/feroda"
  messenger = "https://m.me/luca.ferroni.75"
  linkedin = "https://www.linkedin.com/in/lucaferroni/"
  # link wa.me/<numero> per scrivermi su WhatsApp (es. https://wa.me/39NUMERO, prefisso senza + e senza spazi); vuoto = link nascosto
  whatsappPersonale = ""
  # Codice GoatCounter: la parte prima di .goatcounter.com (es. "hacking4love").
  # Vuoto = nessuno script di statistiche.
  goatcounter = "feroda"
  # Messaggio dei bottoni «Condividi» (WhatsApp, Telegram, menu del telefono) in «Aiuta Uroboro».
  # Il link condividiUrl va in testa al messaggio, poi una riga vuota e il testo.
  # {canale} nel testo diventa il link al canale Telegram (parametro telegram): se cambi canale, il messaggio si aggiorna da solo.
  condividiTesto = "Scopri la vision di Luca Ferroni: siamo alla fine di un'era. È necessario rimettere l'UOMO al centro. Luca Ferroni dice che si può fare ({canale}) con persone consapevoli come il Papa, Vasco Rossi o Elisa o altri cantanti. Se conosci qualcuno più vicino a loro, inoltragli questo messaggio. Grazie!"
  condividiUrl = "https://hacking4love.it"
  # Link ai CV (PDF). Vuoto = pulsante nascosto.
  cvIt = ""
  cvEn = ""

[markup.goldmark.renderer]
  unsafe = true

[menus]
  [[menus.main]]
    name = "Il puzzle"
    url = "/#puzzle"
    weight = 10
  [[menus.main]]
    name = "Manifesto"
    url = "/manifesto/#manifesto"
    weight = 20
  [[menus.main]]
    name = "Cantanti"
    url = "/manifesto/#vasco"
    weight = 25
  # Soluzioni fuori dal menu: ci si arriva dal puzzle («Guarda come l'ho risolto io»).
  # [[menus.main]]
  #   name = "Soluzioni"
  #   url = "/soluzioni/"
  [[menus.main]]
    name = "Il mio percorso"
    url = "/il-mio-percorso/"
    weight = 30
  # Indizi nascosto dal menu: la pagina /articoli/ resta raggiungibile solo per URL.
  # [[menus.main]]
  #   name = "Indizi"
  #   url = "/articoli/"
  #   weight = 40
  [[menus.main]]
    name = "Aiuta Uroboro"
    url = "/#aiuta"
    weight = 50

# I commenti HTML scritti apposta (es. la frase nascosta in «Aiuta Uroboro») restano nel sorgente anche con --minify
[minify.tdewolff.html]
  keepComments = true

  [[menus.main]]
    name = "Il puzzle"
    url = "/#puzzle"
    weight = 20
  [[menus.main]]
    name = "Come l'ho risolto"
    url = "/come-l-ho-risolto/"
    weight = 30
  [[menus.main]]
    name = "Indizi"
    url = "/articoli/"

baseURL = "https://hacking4love.it/"
languageCode = "it-IT"
defaultContentLanguage = "it"
title = "Hacking 4 Love"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Mi offro per chiudere Uroboro. Sono qui per ritrovare l'UOMO al centro dell'Universo. Componi il puzzle."
  autore = "Lucafero da Fabriano"
  email = "luca@befair.it"
  # Il tuo sito personale: gli articoli-indizio vivranno lì
  sitoPersonale = "https://example.org/"
  # Canale Telegram del progetto. Vuoto = pulsante nascosto.
  telegram = "https://t.me/my_uroboro"
  # Contatti privati. Vuoto = link nascosto.
  telegramPersonale = "https://t.me/feroda"
  messenger = "https://m.me/luca.ferroni.75"
  linkedin = "https://www.linkedin.com/in/lucaferroni/"
  # Codice GoatCounter: la parte prima di .goatcounter.com (es. "hacking4love").
  # Vuoto = nessuno script di statistiche.
  goatcounter = "feroda"

[markup.goldmark.renderer]
  unsafe = true

[menus]

    name = "Manifesto"
    url = "/#manifesto"
    weight = 10
  [[menus.main]]
    name = "Cantanti"
    url = "/#vasco"
    weight = 15
  [[menus.main]]
    name = "Il puzzle"
    url = "/#puzzle"
    weight = 20
  [[menus.main]]
    name = "Come l'ho risolto"
    url = "/come-l-ho-risolto/"
    weight = 30
  [[menus.main]]
    name = "Indizi"
    url = "/articoli/"
    weight = 40
  [[menus.main]]
    name = "Contatti"
    url = "/#contatti"
    weight = 50

<!doctype html>
<html lang="it">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}{{ end }}">
  <canvas id="stelle" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  {{ partial "header.html" . }}
  <main id="contenuto">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
  {{ $pz := resources.Get "js/puzzle.js" | minify | fingerprint }}
  <script src="{{ $pz.RelPermalink }}" defer></script>
</body>
</html>

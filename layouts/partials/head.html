<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ $title := cond .IsHome (printf "%s · Ritrovare l'UOMO al centro dell'Universo" site.Title) (printf "%s · %s" .Title site.Title) }}
<title>{{ $title }}</title>
<meta name="description" content="{{ with .Params.sottotitolo }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta name="author" content="{{ site.Params.autore }}">
<meta name="theme-color" content="#07070d">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "img/og.jpg" | absURL }}">
<meta property="og:locale" content="it_IT">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="preload" href="{{ "fonts/cinzel-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "fonts/inter-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">

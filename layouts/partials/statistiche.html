{{- /* Statistiche visite con GoatCounter: niente cookie, nessun dato personale salvato, quindi nessun banner.
     Attivo solo nella build di produzione (hugo), non con "hugo server". */ -}}
{{- with site.Params.goatcounter -}}
{{- if hugo.IsProduction -}}
<script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{{- end -}}
{{- end -}}

# Il puzzle: 4 sigilli, uno per colonna dell'immagine (U · O · M · O).
# Ogni sigillo si apre con una parola-chiave che si trova leggendo un articolo.
# Nel sito c'è solo l'hash SHA-256 della parola, non la parola.
# La parola viene normalizzata così: minuscolo, senza accenti, senza spazi ai lati.
# Per calcolare un nuovo hash:   echo -n "parola" | sha256sum
# "link": il testo del link all'articolo nel gioco ("articolo" è il titolo vero, usato nella pagina Indizi).
# "alias" (facoltativo): altri hash accettati per lo stesso sigillo, per i sinonimi.
# PAROLE (scelte dall'utente, prese da articoli già esistenti): bellezza, sharing is caring,
# ridere di te, liberta. Domande e racconti sono bozze.

immagine: "/img/uomo-uroboro.jpg"
colonne: 4
righe: 3

sigilli:
  - lettera: "U"
    nome: "Il sigillo della Sezione Aurea"
    link: "Ecco l'articolo per capirlo"
    articolo: "La bellezza ci salverà"
    url: "https://lucaferroni.it/posts/bellezza/"
    domanda: "Ci dobbiamo alimentare di positività e di… cosa? È lei che ci salverà."
    hash: "5266532d434b9002561a28061c07b958b57c19b877faccf203e5c4ec84299857"
    racconto: "Il primo pezzo è uno sguardo: guardare con occhi nuovi il mondo in cui siamo immersi, e riconoscere la differenza come qualcosa che arricchisce. Lì ho trovato la bellezza."
  - lettera: "O"
    nome: "Il sigillo del sapere che non si consuma"
    link: "Perché condivido l'Art. 3 con lo scopo del PDP FSUG"
    articolo: "Lo scopo del PDP"
    url: "https://lucaferroni.it/posts/pdp-articolo-3/"
    domanda: "Un motto inglese di tre parole mi spinge a condividere lo statuto del PDP. Quale?"
    hash: "049d35a0520907006c515546e6a71d5bc58e21f3ed6ddc00cd2f5b20c326c45a"
    racconto: "Il secondo pezzo viene dal 2003, dal PDP e dal software libero: prima l'etica, poi la tecnica. Il sapere che circola non si consuma, cresce. Condividere è prendersi cura."
  - lettera: "M"
    nome: "Il sigillo dello Scanzonato"
    link: "Il mio commento alla canzone"
    articolo: "Canzone: Ridere di Te"
    url: "https://lucaferroni.it/posts/song-ridere-di-te/"
    domanda: "Una canzone di Vasco, con il Te maiuscolo: il principio femminile dell'Universo. Qual è il titolo?"
    hash: "d8c2d72d57e3cae785f42378f3a30c78a625404f60b9f653242147acb355d8b6"
    racconto: "Il terzo pezzo è una canzone. Maschile e femminile, tutti e due imperfetti, che ridono l'uno dell'altro con rispetto. Chi sa ridere di sé e dell'altro non ha bisogno di vincere."
  - lettera: "O"
    nome: "Il sigillo dello scopo dell'UOMO"
    link: "Il progetto da 1 miliardo di €"
    articolo: "1 miliardo per la libertà"
    url: "https://github.com/feroda/1/blob/main/README_it.md"
    domanda: "Un progetto aperto per gestire un miliardo di euro. A che scopo?"
    hash: "8ff576f9c1f4130066da185a946c4d6a7438b2bf1715fa6c28ab1b514bf41aa1"
    racconto: "L'ultimo pezzo chiude il cerchio: una libertà delicata, che tutela quella di ognuno fin dove inizia quella degli altri. Bellezza, condivisione, un sorriso con rispetto portano lì. E quando il serpente si morde la coda, al centro resta l'UOMO."

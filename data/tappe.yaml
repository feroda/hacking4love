# Le tappe del percorso (pagina "Il mio percorso"). Modificabili liberamente.
# chiave: true = tappa sempre visibile; le altre compaiono con «Mostra tutto il percorso».
# link (facoltativo) = elenco di {testo, url}: url completo (https://...) o file del sito (/documenti/...).
# tipo = icona sulla linea: personale (omino), lavoro (valigetta), gnu (software libero), maniacale (croce rossa).
- quando: "1998"
  titolo: "La maturità"
  tipo: "personale"
  testo: "Conseguo la maturità scientifica con 52/60 e, allo stesso tempo, trionfo superando da privatista l'esame di solfeggio al Conservatorio Rossini di Pesaro."
- quando: "1999-2004"
  titolo: "Laurea in Informatica"
  tipo: "personale"
  chiave: true
  testo: "Mi laureo nel percorso quinquennale di Informatica con 104/110. La tesi è «Studio, progettazione e realizzazione di un filesystem in spazio utente per le distribuzioni GNU/Linux», nata da un'idea di Richard Stallman durante una cena insieme a Modena."
- quando: "2003"
  titolo: "Socio ILS e fondatore del PDP"
  tipo: "gnu"
  chiave: true
  testo: "Divento socio di ILS - Italian Linux Society e fondo PDP Free Software User Group, che presiedo fino al 2024. Comincio a raccontare il software libero in pubblico. Prima intuizione: la libertà si condivide, non si compra."
  link:
    - testo: "Italian Linux Society"
      url: "https://linux.it"
    - testo: "Lo Statuto del PDP (PDF)"
      url: "/documenti/pdp-statuto.pdf"
- quando: "2004-2009"
  titolo: "Ai Laboratori Guglielmo Marconi"
  tipo: "lavoro"
  testo: "Gli anni del primo lavoro: assunto prima di laurearmi, ricordo bene che ho dovuto chiedere 15 giorni di pausa prima di iniziare. Un ambiente indimenticabile, con colleghi che sento ancora oggi, 17 anni dopo il mio trasferimento a Fabriano, nelle Marche."
- quando: "2008-2009"
  titolo: "Gli anni di beFair s.n.c. e del progetto JAGOM"
  tipo: "lavoro"
  testo: "Con beFair s.n.c. inizio a sviluppa JAGOM, «JAGOM is A Grain Of Mustard seed»: un acronimo ricorsivo, come da tradizione hacker. È un social network fatto per il terzo settore, per sviluppare COMUNICAZIONE, ORGANIZZAZIONE, OPERATIVITÀ ed EVOLUZIONE."
- quando: "2009"
  titolo: "Il diploma di Master in Scienze e Tecnologie del Software Libero e Open Source"
  tipo: "personale"
  testo: "Diretto dall'indimenticabile prof. Renzo Davoli, già relatore della mia tesi di laurea."
- quando: "2009"
  titolo: "Referente informatico della REES Marche"
  tipo: "gnu"
  testo: "Per dieci anni curo l'informatica della REES Marche - Rete di Economia Etica e Solidale delle Marche. Con altri 2 sviluppatori realizziamo Gasista Felice, per i Gruppi di Acquisto Solidale: è ancora attivo dopo 15 anni."
- quando: "2009 - oggi"
  titolo: "Io Libero Professionista"
  tipo: "lavoro"
  testo: "beFair, azienda formalmente abbandonata, rimane come bel marchio. Io proseguo come Luca Ferroni: sviluppatore nell'ambito delle reti e dei sistemi di monitoraggio, gestore di server GNU/Linux e docente di corsi post diploma ITS sulla CyberSecurity."
  chiave: true
  link:
    - testo: "befair.it"
      url: "https://befair.it"
- quando: "2009-2010"
  titolo: "Il Vademecum e il Dossier Scuola: 30.000 copie"
  tipo: "gnu"
  chiave: true
  testo: "Coordino e scrivo, con altri, il Vademecum sul Software Libero (Linux Day 2009, 20.000 copie) e il Dossier Scuola «Liberi di imparare» (Linux Day 2010, 10.000 copie), distribuiti in tutta Italia."
  link:
    - testo: "Il Vademecum sul Software Libero (PDF)"
      url: "/documenti/vademecum-software-libero-2009.pdf"
    - testo: "Il Dossier Scuola «Liberi di imparare» (PDF)"
      url: "/documenti/dossier-scuola-liberi-di-imparare-2010.pdf"
- quando: "2010"
  titolo: "Al tavolo tecnico con Richard Stallman"
  tipo: "gnu"
  chiave: true
  testo: "Il Software Libero come questione etica, socioeconomica e infine tecnica. Sono co-organizzatore della visita di Richard Stallman, che tiene 2 conferenze: una al Comune di Ancona, l'altra all'Università Politecnica delle Marche. Il tavolo tecnico è pensato per i referenti tecnici di strutture chiave come la Sanità, la Provincia, il Comune e l'Università stessa, e qui ho l'onore di introdurlo con una presentazione preparata a 4 mani con lui."
  link:
    - testo: "La presentazione (PDF)"
      url: "/documenti/tavolo-tecnico-rms-2010.pdf"
- quando: "2012"
  titolo: "Software libero al MIUR, due anni dopo"
  tipo: "gnu"
  testo: "Portare la libertà digitale nella scuola, come referente nazionale di Associazione Nazionale per il Software Libero (Assoli) delle relazioni con il MIUR."
- quando: "23 gennaio 2012"
  titolo: "Euclides André Mance e Richard Stallman si incontrano"
  tipo: "gnu"
  chiave: true
  testo: "Su mia iniziativa e facilitazione, con il supporto della REES Marche e di Solidarius Italia, rendiamo possibile l'incontro di questi 2 grandi della Terra a Curitiba, in Brasile. Ne esce una dichiarazione di comunione di intenti tra i 2, per le reti del Software Libero e quelle dell'Economia Solidale."
  link:
    - testo: "La dichiarazione di intenti"
      url: "https://stallman.org/solidarity-economy.it.html"
- quando: "Luglio 2012"
  titolo: "6ª Conferenza Italiana sul Software Libero"
  tipo: "gnu"
  testo: "Coordino la realizzazione della conferenza annuale sul Software Libero, che si tiene all'Università Politecnica delle Marche con i temi SCUOLA, SOLUZIONI, SCENARIO e METODI, PA e OPEN GOVERNMENT, QA, OPEN DATA, SANITÀ."
- quando: "2013"
  titolo: "Hacker: una parola, uno stile di vita"
  tipo: "personale"
  testo: "Hacking non è rompere: è capire come funziona una cosa per renderla migliore e libera. Il 12 novembre scrivo la prima lettera al Papa, su carta Fabriano."
- quando: "2013-2016, 2025"
  titolo: "Docente all'ITIS Merloni Miliani di Fabriano"
  tipo: "lavoro"
  testo: "Nell'indirizzo di Informatica, ovviamente. La mia materia è TPSIT, il cui nome è quasi mezzo programma: «Tecnologie e Progettazione di Sistemi Informatici e di Telecomunicazioni». Un bel ricordo dei ragazzi che vi partecipavano e dei colleghi più motivati."
- quando: "2014-2020"
  titolo: "Il MakerSpace della Biblioteca Multimediale R. Sassi"
  tipo: "gnu"
  testo: "Gli anni indimenticabili di Passion, Play, Project, Peer (LCL - Learning Creative Learning, dal MIT di Boston). Gli anni della sperimentazione: dalla Maker Faire Rome con l'app per suonare collettivamente, agli ologrammi, al telaio jacquard."
  chiave: true
  link:
    - testo: "Il Manifesto dello Spazio Creativo (PDF)"
      url: "/documenti/manifesto-spazio-creativo-2014.pdf"
- quando: "2018-2022"
  titolo: "beFair, un network di professionisti"
  tipo: "lavoro"
  testo: "Lavoriamo in team, un grande team: Riccardo, Francesco e Dawid fissi, poi in modo non continuativo Chiara, Michele e Andrea. Il lavoro si porta avanti ognuno con la propria Partita IVA o con prestazione occasionale."
- quando: "Aprile 2019 - aprile 2022"
  titolo: "Coordinatore locale del progetto DOORS"
  tipo: "lavoro"
  chiave: true
  testo: "Un progetto pedagogico basato sulla Pedagogia del Desiderio di M.C. Carvalho e Cesare de Florio La Rocca, derivata dalla Pedagogia dell'Oppresso di Paulo Freire, poi sull'ArtEducazione e infine, con noi, su LCL. Stupefacente per le reazioni dei ragazzi delle scuole medie che partecipavano. 28 partner, 2 milioni di euro."
  link:
    - testo: "A Porte Aperte, progetto DOORS (PDF)"
      url: "/documenti/doors-a-porte-aperte.pdf"
- quando: "2020-2021"
  titolo: "IoRestoACasa.work, videoconferenze libere nel lockdown"
  tipo: "gnu"
  chiave: true
  testo: "Pochi giorni dopo l'inizio del lockdown lanciamo, in quattro, un servizio gratuito di videoconferenza basato sul Software Libero Jitsi Meet, insieme alla rete della ricerca GARR, al CINECA e alle università italiane. Nei primi quindici giorni: 20.300 videochiamate su 46 server. Scrivo l'automazione dei server e coordino il team tecnico. Ne parlano il TG1, la Repubblica e l'Huffington Post."
  link:
    - testo: "iorestoacasa.work"
      url: "https://iorestoacasa.work"

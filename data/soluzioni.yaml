# Tre azioni per la nostra società (pagina "Il mio percorso").
# Testi in bozza, ricavati da elezioni-marche-2020.lucaferroni.it e dai PDF: da rileggere.
- ambito: "Per il Territorio"
  titolo: "Centri di Rigenerazione Territoriale (CRT)"
  testo: "Un cambio di prospettiva che rimette al centro la persona: luoghi belli dove incontrarsi, far parlare tra loro bisogni e talenti del territorio e unire lavoro, cultura e arte."
  azioni:
    - "Aprire luoghi d'incontro inclusivi e sperimentarli sul campo"
    - "Formare competenze software per soluzioni locali"
    - "Sale per arte, musica, meditazione e svago"
    - "Sostenere équipe pedagogiche e progetti come le scuole di samba"
    - "Collaborare con i gruppi di acquisto solidale"
    - "Un piccolo punto di smistamento delle merci"
    - "Raccogliere i bisogni e collegarli a chi produce sul territorio"
    - "Squadre SCRUM per i problemi rimasti irrisolti"
  pdf: "documenti/crt-centri-rigenerazione-territoriale.pdf"
  credito: "Luca Ferroni, 2020 · CC BY-NC 4.0"
- ambito: "Per Internet"
  titolo: "Internet libera"
  testo: "I protocolli di Internet sono un bene comune inalienabile, e dati e contenuti in rete una risorsa collettiva: a nessuno può essere impedito di accedere ai contenuti pubblici."
  azioni:
    - "Dati pubblici aperti, su cui le imprese possano costruire servizi"
    - "Infrastrutture cloud nazionali per i servizi della pubblica amministrazione"
    - "Servizi ben documentati, con API per chi sviluppa"
    - "Documentazione per sviluppatori chiesta a ogni fornitore"
    - "L'analisi comparativa dell'art. 68 del CAD prima di adottare una soluzione"
    - "Standard locali definiti con il modello RFC, lo stesso che regge Internet"
  pdf: "documenti/principi-fondamentali-internet-2012.pdf"
  credito: "La posizione italiana sui principi fondamentali di Internet, 2012"
- ambito: "Per l'Educazione"
  titolo: "Pedagogia del Desiderio a Scuola"
  testo: "Un'alleanza tra scuola e territori per l'inclusione e le pari opportunità educative, nata dal progetto DOORS. La Pedagogia del Desiderio è il primo dei suoi riferimenti, accanto ad ArtEducazione e Learning Creative Learning."
  azioni:
    - "Sostenere i progetti basati su Pedagogia del Desiderio, ArtEducazione e Learning Creative Learning"
    - "MakerSpace come presìdi del territorio collegati alle scuole"
    - "Alleanze in cui vincono tutti con chi gestisce i MakerSpace"
    - "Una figura part-time nelle biblioteche"
    - "Enti locali che aderiscono e partecipano ai Tavoli di Programmazione Territoriale"
  pdf: "documenti/doors-a-porte-aperte.pdf"
  credito: "A Porte Aperte, progetto DOORS (28 partner, CIES Onlus capofila)"
